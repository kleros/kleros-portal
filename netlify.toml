[build]
  base = "/"
  command = "yarn turbo run build --filter=web; (mkdir -p apps/web/.next/static; env | sort > apps/web/.next/env-dump.txt; env | sort > apps/web/.next/static/env-dump.txt; true)"
  publish = "apps/web/.next"

[build.environment]
  # 22.23.4 is the first 22.x with the October 2026 security fixes (CVE-2026-111497).
  NODE_VERSION = "22.23.4"

[[plugins]]
  package = "@netlify/plugin-nextjs"
